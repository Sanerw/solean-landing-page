# pnpm blocks every dependency's postinstall unless it is approved here, and the two
# versions in play spell the approval differently, so both spellings are carried.
#
# sharp compiles the libvips binaries @sveltejs/enhanced-img needs to generate the responsive
# image candidates. A machine with a warm pnpm store already has it built and says nothing,
# which is why the gap only appeared on a cold CI install.
#
# `onlyBuiltDependencies` is what pnpm 10 reads. pnpm 11 replaced it with `allowBuilds` and
# fails the install outright, which is what Vercel runs by default on this project. pnpm 10
# ignores the key it does not know, and pnpm 11 ignores the one it superseded.
onlyBuiltDependencies:
  - esbuild
  - sharp

allowBuilds:
  esbuild: true
  sharp: true

# Temporary, to unblock a Vercel deploy. pnpm 11 defaults minimumReleaseAge to 1440 minutes and
# re-applies that threshold to every lockfile entry on install, so the build rejected fifteen
# Sanity packages published on 2026-09-01, ten minutes younger than its cutoff. The local pnpm 10
# uses a threshold of 0, which is why the lockfile was written without a warning.
# The real fix is to pin packageManager to pnpm 11 and drop this key, so the threshold binds where
# the lockfile is created rather than only where it is read.
minimumReleaseAge: 0
