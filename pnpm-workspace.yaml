# pnpm blocks every dependency's postinstall unless it is approved here, and the two
# versions in play spell the approval differently, so both spellings are carried.
#
# sharp compiles the libvips binaries @sveltejs/enhanced-img needs to generate the responsive
# image candidates. A machine with a warm pnpm store already has it built and says nothing,
# which is why the gap only appeared on a cold CI install.
#
# `onlyBuiltDependencies` is what pnpm 10 reads. pnpm 11 replaced it with `allowBuilds` and
# fails the install outright. `packageManager` now pins pnpm 11 everywhere, so only the second
# spelling is read in practice; the first stays because pnpm 11 ignores the key it superseded and
# it costs nothing to keep an install with an older pnpm working.
onlyBuiltDependencies:
  - esbuild
  - sharp

allowBuilds:
  esbuild: true
  sharp: true

# pnpm 11 holds a package back for a day after it is published, which is what broke the Vercel
# install: the lockfile carried Sanity releases minutes younger than that window. The threshold is
# left at its default so it binds here, where the lockfile is written, rather than only on the
# build machine that reads it.
#
# pnpm wrote this exclusion itself during the fresh resolution: a peer range left no older
# @sanity/types to fall back to. It is pinned to that one version, so a later release is held back
# again like everything else.
minimumReleaseAgeExclude:
  - '@sanity/types@6.12.0'
